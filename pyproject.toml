[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kolnote"
version = "0.1.0"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
description = "Channel-agnostic voice-note transcription bridge with swappable channel and STT adapters"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
faster-whisper = ["faster-whisper>=1.0", "av>=12,<17"]
http = ["httpx>=0.27"]
wyoming = ["wyoming>=1.5,<2"]
dev = ["pytest>=8", "httpx>=0.27", "wyoming>=1.5,<2"]

[project.scripts]
kolnote = "kolnote.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
